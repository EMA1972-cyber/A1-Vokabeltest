<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Vokabeltests A1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ef;min-height:100vh}

/* START */
#pgS{display:flex;flex-direction:column;align-items:center;padding:.5rem .8rem;min-height:100vh}
#pgS h1{font-size:1.8rem;font-weight:700;color:#1a1a2e;margin:.4rem 0 .2rem;text-align:center}
.sub{color:#999;font-style:italic;margin-bottom:.6rem;font-size:.85rem;text-align:center}
#menu{width:100%}
.card{width:100%;background:#fff;border-radius:8px;padding:.42rem .9rem;margin:.2rem 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid #3a86ff;-webkit-tap-highlight-color:rgba(0,0,0,.05)}
.card:active{opacity:.8}
.card.boss{border-left-color:#e63946}
.ct{font-size:1rem;font-weight:700;color:#1a1a2e}
.cm{font-size:.75rem;color:#999;margin-top:.05rem}
.arr{font-size:1.4rem;color:#3a86ff;flex-shrink:0}
.boss .arr{color:#e63946}

.hint{background:#fff3cd;border:1px solid #ffc107;border-radius:6px;padding:.35rem .8rem;font-size:.78rem;color:#856404;margin-bottom:.5rem;text-align:center;width:100%}

#fireworks{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}

/* NAME */
#pgN{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem 1rem}
#pgN h2{font-size:2rem;color:#1a1a2e;margin-bottom:.4rem;text-align:center}
#pgN p{color:#888;font-size:1rem;margin-bottom:1.5rem;text-align:center}
.nbox{width:82%;max-width:340px;background:#fff;border-radius:14px;padding:1.5rem;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.ninp{width:100%;border:2px solid #ddd;border-radius:10px;padding:.9rem 1rem;font-size:16px;font-family:-apple-system,sans-serif;outline:none;margin-bottom:1rem;-webkit-appearance:none;display:block}
.ninp:focus{border-color:#3a86ff}
.nstart{width:100%;background:#3a86ff;color:#fff;border:none;border-radius:10px;padding:.95rem;font-size:1.05rem;font-family:-apple-system,sans-serif;cursor:pointer}
.nstart.boss{background:#e63946}
.nback{display:block;width:100%;background:none;border:none;color:#aaa;font-size:.9rem;margin-top:.8rem;text-decoration:underline;text-align:center;cursor:pointer;padding:.3rem;font-family:-apple-system,sans-serif}

/* TEST */
#pgT{display:none}
.hdr{background:#1a1a2e;color:#fff;padding:.85rem 1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;width:100%}
.htl{font-size:.88rem;font-weight:700;flex:1;margin-right:.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrt{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.prg{font-size:.82rem;color:#aaa}
.bbk{background:none;border:1px solid #555;color:#ccc;border-radius:6px;padding:.28rem .65rem;cursor:pointer;font-size:.8rem;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;padding:.7rem .8rem 6rem}
.q{background:#fff;border-radius:10px;padding:.8rem .9rem;margin:.5rem 0;box-shadow:0 1px 4px rgba(0,0,0,.06);width:100%}
.qhead{display:flex;align-items:baseline;gap:.4rem;margin-bottom:.4rem}
.qn{font-size:.75rem;color:#bbb;flex-shrink:0}
.qen{font-style:italic;color:#1a1a2e;font-size:.95rem;flex:1}
.qi{width:100%;border:none;border-bottom:2px solid #ddd;padding:.4rem 0;font-size:16px;font-family:-apple-system,sans-serif;background:transparent;outline:none;-webkit-appearance:none;appearance:none;display:block}
.qi:focus{border-color:#3a86ff}
.qi.ok{border-color:#2dc653;background:#f0fff4;color:#186a2e;padding:.4rem .4rem;border-radius:6px 6px 0 0}
.qi.er{border-color:#e63946;background:#fff5f5;color:#b02030;padding:.4rem .4rem;border-radius:6px 6px 0 0}
.qi.sk{color:#bbb;font-style:italic}
.ht{font-size:.8rem;display:none;padding:.15rem 0;color:#888}
.ht.ok{color:#2dc653;display:block}
.ht.er{color:#e63946;display:block}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:.9rem 1rem;text-align:center;box-shadow:0 -2px 12px rgba(0,0,0,.07)}
.bsb{background:#3a86ff;color:#fff;border:none;border-radius:12px;padding:.95rem 2rem;font-size:1.05rem;font-family:-apple-system,sans-serif;cursor:pointer;width:100%;max-width:380px;min-height:50px;-webkit-tap-highlight-color:transparent}
.bsb.boss{background:#e63946}

/* RESULT */
.rbx{background:#fff;border-radius:14px;padding:1.5rem 1.2rem;text-align:center;margin:.5rem 0;box-shadow:0 2px 16px rgba(0,0,0,.09)}
.rname{font-size:.95rem;color:#888;margin-bottom:.3rem}
.sc{font-size:3rem;font-weight:700;color:#3a86ff;line-height:1}
.sc.boss{color:#e63946}
.sp{font-size:.9rem;color:#666;margin:.4rem 0}
.nbox2{margin:.8rem 0;padding:.9rem 1.2rem;border-radius:12px;width:100%}
.nbox2.pass{background:#f0fff4;border:2px solid #2dc653}
.nbox2.fail{background:#fff5f5;border:2px solid #e63946}
.nrow{display:flex;align-items:center;justify-content:center;gap:1rem}
.nnum{font-size:2.2rem;font-weight:700}
.nnum.pass{color:#186a2e}
.nnum.fail{color:#b02030}
.nlbl{font-size:1rem;color:#555}
.nsts{font-size:1rem;font-weight:700;margin-top:.2rem}
.nsts.pass{color:#186a2e}
.nsts.fail{color:#b02030}
.eml{font-size:.8rem;color:#aaa;margin:.4rem 0}
.brt{background:#1a1a2e;color:#fff;border:none;border-radius:10px;padding:.8rem 1.5rem;font-size:.95rem;font-family:-apple-system,sans-serif;cursor:pointer;margin-top:.8rem;width:100%;-webkit-tap-highlight-color:transparent}
</style>
</head>

<canvas id="fireworks"></canvas>
<div id="pgS">
  <h1>Vokabeltests A1</h1>
  <p class="sub">Goethe-Zertifikat &mdash; Englisch &rarr; Deutsch</p>
  <div class="hint">💡 Bitte beachten: Artikel, Verben und Adjektive klein schreiben — auch am Satzanfang!</div>
  <div id="menu"></div>
</div>

<div id="pgN">

    <button class="nstart" id="nstart" onclick="startMitName()">Test starten &rarr;</button>
    <button class="nback" onclick="goHome()">&#8592; Zur&uuml;ck</button>
  </div>
</div>

<div id="pgT">

    </div>

  <div class="wrap">
    <div id="qs"></div>
    <div id="rb"></div>
  </div>
  <div class="bar" id="bar">
    <button class="bsb" id="bsb" onclick="auswerten()">Auswerten &rarr;</button>
  </div>
</div>

var cur=null,done=false,name_='';

function buildMenu(){
  var m=document.getElementById('menu');
  m.innerHTML='';
  TESTS.forEach(function(t,i){
    var boss=t.id===9;
    var c=document.createElement('div');
    c.className='card'+(boss?' boss':'');
    c.innerHTML='<div><div class="ct">'+(boss?'&#127942; ':'')+t.titel+'</div><div class="cm">'+t.v.length+' Vokabeln</div></div><span class="arr">&#8594;</span>';
    c.onclick=function(){zeigeN(i);};
    m.appendChild(c);
  });
}

function goHome(){
  document.getElementById('pgS').style.display='flex';
  document.getElementById('pgN').style.display='none';
  document.getElementById('pgT').style.display='none';
  cur=null;done=false;name_='';
}

function zeigeN(idx){
  cur=TESTS[idx];
  var boss=cur.id===9;
  document.getElementById('nTitle').textContent=cur.titel;
  document.getElementById('nstart').className='nstart'+(boss?' boss':'');
  document.getElementById('ninp').value='';
  document.getElementById('ninp').style.borderColor='#ddd';
  document.getElementById('pgS').style.display='none';
  document.getElementById('pgN').style.display='flex';
}

function startMitName(){
  var n=document.getElementById('ninp').value.trim();
  if(!n){document.getElementById('ninp').style.borderColor='#e63946';return;}
  name_=n;
  document.getElementById('pgN').style.display='none';
  goTest();
}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&document.getElementById('pgN').style.display==='flex')startMitName();
});

function goTest(){
  var boss=cur.id===9;
  done=false;
  document.getElementById('pgT').style.display='block';
  document.getElementById('ttl').textContent=cur.titel+' — '+name_;
  document.getElementById('bsb').className='bsb'+(boss?' boss':'');
  document.getElementById('bar').style.display='block';
  document.getElementById('rb').innerHTML='';
  var qs=document.getElementById('qs');
  qs.innerHTML='';
  cur.v.forEach(function(vok,i){
    var d=document.createElement('div');
    d.className='q';
    d.innerHTML=
      '<div class="qhead"><span class="qn">'+(i+1)+'.</span><span class="qen">'+vok[1]+'</span></div>'+
      '<input class="qi" id="q'+i+'" type="text" placeholder="Deutsches Wort..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">'+
      '<span class="ht" id="h'+i+'"></span>';
    qs.appendChild(d);
    (function(idx){
      var inp=document.getElementById('q'+idx);
      inp.addEventListener('input',upd);
      inp.addEventListener('keydown',function(e){
        if(e.key==='Enter'){
          e.preventDefault();
          var n=document.getElementById('q'+(idx+1));
          if(n){n.focus();n.scrollIntoView({behavior:'smooth',block:'center'});}
        }
      });
    })(i);
  });
  upd();
  window.scrollTo(0,0);
}

function upd(){
  if(!cur)return;
  var f=0;
  cur.v.forEach(function(v,i){var e=document.getElementById('q'+i);if(e&&e.value.trim())f++;});
  document.getElementById('prg').textContent=f+' / '+cur.v.length;
}

function norm(s){return s.trim().replace(/\s+/g,' ');}

function getNote(pct){
  if(pct>=95)return{n:'1',l:'Sehr gut',pass:true};
  if(pct>=85)return{n:'2',l:'Gut',pass:true};
  if(pct>=78)return{n:'3',l:'Befriedigend',pass:true};
  if(pct>=70)return{n:'4',l:'Ausreichend',pass:true};
  if(pct>=50)return{n:'5',l:'Mangelhaft',pass:false};
  return{n:'6',l:'Ungenügend',pass:false};
}

function auswerten(){
  if(done)return;done=true;
  var ok=0,wrong=0,skip=0,fehler=[];
  cur.v.forEach(function(vok,i){
    var inp=document.getElementById('q'+i);
    var ht=document.getElementById('h'+i);
    var ans=inp.value.trim();
    var exp=vok[0];
    inp.readOnly=true;
    if(!ans){
      skip++;inp.value='---';inp.className='qi sk';
      ht.textContent='→ '+exp;ht.className='ht er';
      fehler.push({en:vok[1],antwort:'(leer)',richtig:exp});
    }else if(norm(ans)===norm(exp)){
      ok++;inp.className='qi ok';
      ht.textContent='✓ Richtig!';ht.className='ht ok';
    }else{
      wrong++;inp.className='qi er';
      ht.textContent='→ '+exp;ht.className='ht er';
      fehler.push({en:vok[1],antwort:ans,richtig:exp});
    }
  });
  var tot=cur.v.length,pct=Math.round(ok/tot*100),note=getNote(pct),boss=cur.id===9;
  document.getElementById('bar').style.display='none';
  var rb=document.getElementById('rb');
  rb.innerHTML=
    '<div class="rbx">'+
    '<div class="rname">'+name_+'</div>'+
    '<div class="sc'+(boss?' boss':'')+'">'+ok+' / '+tot+'</div>'+
    '<div class="sp">'+pct+'% &middot; '+wrong+' falsch &middot; '+skip+' übersprungen</div>'+
    '<div class="nbox2 '+(note.pass?'pass':'fail')+'">'+
    '<div class="nrow"><div class="nnum '+(note.pass?'pass':'fail')+'">Note '+note.n+'</div>'+
    '<div><div class="nlbl">'+note.l+'</div>'+
    '<div class="nsts '+(note.pass?'pass':'fail')+'">'+(note.pass?'Bestanden ✓':'Nicht bestanden ✗')+'</div></div></div></div>'+
    '<div class="eml" id="emlInfo">&#9993; Sende Ergebnis...</div>'+
    '<button class="brt" onclick="goHome()">← Zurück zur Übersicht</button>'+
    '</div>';
  rb.scrollIntoView({behavior:'smooth'});
  if(boss && note.pass) setTimeout(function(){FW.start();},500);
  sendEmail(name_,cur.titel,ok,tot,pct,note,fehler,skip);
}

function sendEmail(name,test,ok,tot,pct,note,fehler,skip){
  var body='Schüler: '+name+'\n';
  body+='Test: '+test+'\n';
  body+='Datum: '+new Date().toLocaleString('de-DE')+'\n\n';
  body+='Punkte: '+ok+' / '+tot+'\n';
  body+='Prozent: '+pct+'%\n';
  body+='Note: '+note.n+' - '+note.l+'\n';
  body+=(note.pass?'BESTANDEN':'NICHT BESTANDEN')+'\n\n';
  if(fehler.length){
    body+='Fehler ('+fehler.length+'):\n';
    fehler.forEach(function(f,i){
      body+=(i+1)+'. '+f.en+'\n   Antwort: "'+f.antwort+'" | Richtig: "'+f.richtig+'"\n';
    });
  }
  if(skip) body+='\nÜbersprungen: '+skip;

  emailjs.send('service_mohv83l','template_g45gwbj',{
    to_email:'edvin.matacic@gmail.com',
    subject:'Vokabeltest: '+name+' - '+test+' - Note '+note.n,
    message:body,
    from_name:name
  }).then(function(){
    var e=document.getElementById('emlInfo');
    if(e)e.textContent='✓ Ergebnis an Lehrer gesendet';
  }).catch(function(){
    var e=document.getElementById('emlInfo');
    if(e)e.textContent='(E-Mail-Versand nicht konfiguriert)';
  });
}

// Fireworks
var FW=(function(){
  var c=document.getElementById('fireworks'),ctx=c.getContext('2d'),particles=[],running=false;
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  window.addEventListener('resize',resize);resize();
  function rand(a,b){return Math.random()*(b-a)+a;}
  function burst(x,y){
    var colors=['#ff0','#f0f','#0ff','#f60','#0f0','#f00','#fff','#3a86ff','#e63946'];
    for(var i=0;i<80;i++){
      var angle=Math.random()*Math.PI*2;
      var speed=rand(2,8);
      particles.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
        alpha:1,color:colors[Math.floor(Math.random()*colors.length)],size:rand(2,5)});
    }
  }
  function launch(){
    burst(rand(c.width*.2,c.width*.8),rand(c.height*.1,c.height*.5));
  }
  function loop(){
    if(!running)return;
    ctx.clearRect(0,0,c.width,c.height);
    particles.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.alpha-=0.012;
      ctx.save();ctx.globalAlpha=Math.max(0,p.alpha);
      ctx.fillStyle=p.color;ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.restore();
    });
    particles=particles.filter(function(p){return p.alpha>0;});
    requestAnimationFrame(loop);
  }
  return {
    start:function(){
      running=true;particles=[];
      var count=0;
      var iv=setInterval(function(){
        launch();launch();count++;
        if(count>=12){clearInterval(iv);
          setTimeout(function(){running=false;ctx.clearRect(0,0,c.width,c.height);},2000);}
      },300);
      loop();
    }
  };
})();
